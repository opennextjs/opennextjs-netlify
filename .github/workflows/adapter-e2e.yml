# reference: https://nextjs.org/docs/app/api-reference/adapters/testing-adapters

name: test-e2e-deploy

on:
  workflow_dispatch:
    inputs:
      nextjsRepo:
        description: "Next.js repo (owner/name) — e.g. a fork carrying test changes"
        default: "vercel/next.js"
        type: string
      nextjsRef:
        description: "Next.js repo ref (branch/tag/SHA)"
        default: "canary"
        type: string
      # Uncheck to test a fixture or adapter change against published next
      # without paying for a Rust compile.
      buildNextjs:
        description: "Build Next.js + next-swc from source (default: install published next from npm)"
        default: false
        type: boolean
  # schedule:
  #   - cron: '0 2 * * *'

jobs:
  build:
    name: Build Next.js + adapter
    runs-on: ubuntu-latest
    # Compiling next-swc from source dominates this job: ~25-40min cold, a few
    # minutes once the cargo cache is warm.
    timeout-minutes: 90
    env:
      # Whether to test next.js from this checkout instead of the published npm
      # release — obeys the dispatch input's checkbox.
      BUILD_NEXTJS: ${{ inputs.buildNextjs }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: adapter

      - uses: actions/checkout@v6
        with:
          fetch-depth: 25
          path: nextjs
          repository: ${{ inputs.nextjsRepo }}
          ref: ${{ inputs.nextjsRef }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.6"

      - name: Setup pnpm
        run: npm i -g corepack && corepack enable

      # ---- testing next.js from source (BUILD_NEXTJS) -----------------------
      #
      # Why these steps exist: checking out next.js is NOT enough to test it. In
      # deploy mode the harness writes a plain version string into each
      # fixture's package.json (`next: NEXT_TEST_VERSION || <local version>`,
      # test/lib/next-modes/base.ts:304, reached via
      # createTestDir({skipInstall:true}) in next-deploy.ts:239), and a bare
      # version installs from the public npm registry. Upstream's own CI gets
      # away with that because it points npm at Vercel's preview-builds mirror,
      # which needs credentials we don't have — so without the steps below the
      # `nextjs` checkout supplies only the harness and the test files, and the
      # code under test is whatever npm published. Silently.
      #
      # These produce the artifacts that override that, which the test job
      # picks up by their presence (see "Use Next.js built from source" there):
      #   - packages/next-swc/native/*.node  -> NEXT_TEST_NATIVE_DIR (Rust)
      #   - next-packed.tgz                  -> NEXT_TEST_VERSION    (JS)
      #   - next-env-packed.tgz              -> NEXT_ENV_TARBALL     (JS, see below)
      #
      # Read the pinned nightly out of next.js's own rust-toolchain.toml rather
      # than repeating the version here, where it would silently drift. The file
      # lives in the nested checkout, so the toolchain actions can't find it on
      # their own.
      - name: Read Rust toolchain
        id: rust-toolchain
        if: ${{ env.BUILD_NEXTJS == 'true' }}
        run: |
          CHANNEL="$(grep '^channel' nextjs/rust-toolchain.toml | cut -d'"' -f2)"
          echo "Using Rust $CHANNEL"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        if: ${{ env.BUILD_NEXTJS == 'true' }}
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ env.BUILD_NEXTJS == 'true' }}
        with:
          workspaces: nextjs

      - name: Install Next.js dependencies
        working-directory: nextjs
        run: pnpm i

      # next.js never builds its own native binary when CI is set
      # (scripts/install-native.mjs and packages/next-swc/maybe-build-native.mjs
      # both bail on `process.env.CI`), on the assumption — true upstream, false
      # here — that an earlier job produced it. So it has to be explicit.
      #
      # Release profile, not debug: a debug Turbopack is slow enough to push
      # test shards into their own timeouts.
      - name: Build next-swc (Rust)
        if: ${{ env.BUILD_NEXTJS == 'true' }}
        working-directory: nextjs
        run: pnpm --filter @next/swc run build-native-release

      - name: Build Next.js
        working-directory: nextjs
        run: pnpm run build && pnpm i

      # Pack next itself for the JS half. Lands inside the cached `nextjs` dir
      # so the test shards get it from the same cache as everything else.
      #
      # Also pack @next/env (packages/next-env): it's the only non-optional
      # @next/* dependency in packages/next/package.json, pinned to the exact
      # same monorepo version as next itself. Since this checkout tracks the
      # tip of canary, that exact version routinely hasn't finished publishing
      # to npm yet — installing next-packed.tgz alone then fails resolving
      # @next/env with ERR_PNPM_NO_MATCHING_VERSION. Packing it here and
      # redirecting the fixture's resolution to it (scripts/e2e-deploy.sh) is
      # what makes a from-source next-packed.tgz installable at all.
      - name: Pack Next.js
        if: ${{ env.BUILD_NEXTJS == 'true' }}
        working-directory: nextjs
        run: |
          TARBALL="$(cd packages/next && pnpm pack --pack-destination "$PWD/../.." | tail -1)"
          mv "$TARBALL" next-packed.tgz
          ENV_TARBALL="$(cd packages/next-env && pnpm pack --pack-destination "$PWD/../.." | tail -1)"
          mv "$ENV_TARBALL" next-env-packed.tgz
          ls -la next-packed.tgz next-env-packed.tgz

      # Fail loudly rather than letting the shards quietly test published next —
      # the whole failure mode this input exists to fix is a silent one.
      - name: Verify Next.js was built from source
        if: ${{ env.BUILD_NEXTJS == 'true' }}
        working-directory: nextjs
        run: |
          ok=1
          if ! ls packages/next-swc/native/*.node >/dev/null 2>&1; then
            echo "::error::next-swc native binary missing; shards would use the published @next/swc instead of this checkout's Rust code"
            ok=0
          fi
          if [ ! -f next-packed.tgz ]; then
            echo "::error::next-packed.tgz missing; shards would use the published next instead of this checkout's JS"
            ok=0
          fi
          if [ ! -f next-env-packed.tgz ]; then
            echo "::error::next-env-packed.tgz missing; next's @next/env dependency would resolve from npm instead of this checkout"
            ok=0
          fi
          [ "$ok" -eq 1 ] || exit 1
          ls -la packages/next-swc/native/

      - name: Install Playwright
        working-directory: nextjs
        run: pnpm exec playwright install --with-deps chromium

      # netlify-cli is installed (and version-pinned) in adapter/node_modules by
      # `npm ci` above and cached with the `adapter` dir, so the deploy script can
      # invoke it directly.
      - name: Build adapter
        working-directory: adapter
        run: npm ci && npm run build

      # Pack the adapter once here (it depends only on the build, not on any test
      # fixture) to a stable filename inside the cached `adapter` dir. Each test
      # fixture references this tarball as a file: dependency (see
      # scripts/e2e-deploy.sh), which is faster and more deterministic than
      # pointing a file: dep at the adapter dir (npm would re-pack per fixture).
      - name: Pack adapter
        working-directory: adapter
        run: |
          TARBALL="$(npm pack | tail -1)"
          mv "$TARBALL" adapter-package.tgz

      # Run-level provenance the JUnit reports themselves don't carry: the
      # adapter commit/branch, the requested next.js ref, and the RESOLVED
      # next.js sha + version that was actually built and tested. Written into
      # the cached `adapter` dir (so test jobs can read it too) and uploaded as
      # an artifact the ingest seed script attaches as query params.
      - name: Write run metadata
        run: |
          NEXT_VERSION="$(node -p "require('./nextjs/packages/next/package.json').version")"
          NEXT_SHA="$(git -C nextjs rev-parse HEAD)"
          cat > adapter/adapter-e2e-metadata.json <<JSON
          {
            "adapterRepo": "${{ github.repository }}",
            "adapterSha": "${{ github.sha }}",
            "adapterBranch": "${{ github.ref_name }}",
            "nextjsRepo": "${{ inputs.nextjsRepo }}",
            "nextjsRef": "${{ inputs.nextjsRef }}",
            "nextjsSha": "$NEXT_SHA",
            "nextjsVersion": "$NEXT_VERSION",
            "nextjsFromSource": $BUILD_NEXTJS
          }
          JSON
          cat adapter/adapter-e2e-metadata.json

      - name: Upload run metadata
        uses: actions/upload-artifact@v6
        with:
          name: adapter-e2e-metadata
          path: adapter/adapter-e2e-metadata.json

      - uses: actions/cache/save@v5
        with:
          # Keyed only on sha so that re-runs of the test job (which get a new
          # run_id) can still find the cache saved by the original build run.
          key: build-${{ github.sha }}
          path: |
            ~/.cache/ms-playwright
            adapter
            nextjs

  test:
    name: Tests (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group:
          [
            1/16,
            2/16,
            3/16,
            4/16,
            5/16,
            6/16,
            7/16,
            8/16,
            9/16,
            10/16,
            11/16,
            12/16,
            13/16,
            14/16,
            15/16,
            16/16,
          ]
    steps:
      - uses: actions/cache/restore@v5
        with:
          # Must match the key used in the build job.
          # fail-on-cache-miss ensures a cache miss surfaces here rather than
          # failing cryptically later when a step uses working-directory: nextjs.
          fail-on-cache-miss: true
          key: build-${{ github.sha }}
          path: |
            ~/.cache/ms-playwright
            adapter
            nextjs

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.6"

      - name: Setup pnpm
        run: npm i -g corepack && corepack enable

      - name: Ensure Playwright browser
        working-directory: nextjs
        run: pnpm playwright install chromium

      - name: Make scripts executable
        run: |
          chmod +x adapter/scripts/e2e-deploy.sh
          chmod +x adapter/scripts/e2e-logs.sh
          chmod +x adapter/scripts/e2e-cleanup.sh

      # Restore the list of tests that already passed in an earlier attempt of
      # this same workflow run. On a re-run (github.run_attempt increments) this
      # lets run-tests.js skip already-passed tests and only re-run the ones
      # that were still failing. Scoped per shard (strategy.job-index) and per
      # run (github.run_id), so a new dispatch always starts fresh.
      - name: Restore passed-tests cache
        uses: actions/cache/restore@v5
        with:
          path: nextjs/.next-test-passed.txt
          key: next-test-passed-${{ strategy.job-index }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          restore-keys: |
            next-test-passed-${{ strategy.job-index }}-${{ github.run_id }}-

      # Keyed on what the build job actually produced rather than on
      # BUILD_NEXTJS, so the two can't disagree: if the artifacts aren't in
      # the restored cache, the fixtures install published next and these stay
      # unset. NEXT_TEST_NATIVE_DIR and NEXT_TEST_VERSION are read by next
      # itself, not by the harness — NEXT_TEST_NATIVE_DIR loads the .node
      # directly (build/swc/index.ts:1552) and NEXT_TEST_VERSION becomes the
      # fixture's `next` dependency (next-modes/base.ts:304). NEXT_ENV_TARBALL
      # is ours: next.js has no equivalent override for a dependency's
      # dependency, so scripts/e2e-deploy.sh reads it to redirect @next/env's
      # resolution itself (see the comment on the Pack Next.js step above).
      - name: Use Next.js built from source (if the build job produced it)
        working-directory: nextjs
        run: |
          if ls packages/next-swc/native/*.node >/dev/null 2>&1; then
            echo "NEXT_TEST_NATIVE_DIR=$PWD/packages/next-swc/native" >> "$GITHUB_ENV"
            echo "next-swc: local build"
          else
            echo "next-swc: published @next/swc (from npm)"
          fi
          if [ -f next-packed.tgz ]; then
            echo "NEXT_TEST_VERSION=file:$PWD/next-packed.tgz" >> "$GITHUB_ENV"
            echo "next: local pack"
          else
            echo "next: published (from npm)"
          fi
          if [ -f next-env-packed.tgz ]; then
            echo "NEXT_ENV_TARBALL=$PWD/next-env-packed.tgz" >> "$GITHUB_ENV"
            echo "@next/env: local pack"
          else
            echo "@next/env: published (from npm)"
          fi

      - name: Run deploy tests
        working-directory: nextjs
        env:
          ADAPTER_DIR: ${{ github.workspace }}/adapter
          ADAPTER_TARBALL: ${{ github.workspace }}/adapter/adapter-package.tgz
          IS_TURBOPACK_TEST: 1
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 1d5a5c76-d445-4ae5-b694-b0d3f2e2c395
          NEXT_E2E_TEST_TIMEOUT: 240000
          NEXT_EXTERNAL_TESTS_FILTERS: test/deploy-tests-manifest.json
          # Emit a jest-junit report per test file. jest.config.js sets
          # rootDir: 'test', so with IS_TURBOPACK_TEST the reports land in
          # nextjs/test/turbopack-test-junit-report/.
          NEXT_JUNIT_TEST_REPORT: "true"
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_TEST_JOB: 1
          # Memoize passed test files so GHA re-runs skip them (see cache steps
          # above/below). Path is relative to this step's working-directory
          # (nextjs), i.e. nextjs/.next-test-passed.txt.
          NEXT_TEST_PASSED_FILE: .next-test-passed.txt
          NEXT_TEST_MODE: deploy
          NEXT_TEST_DEPLOY_SCRIPT_PATH: ${{ github.workspace }}/adapter/scripts/e2e-deploy.sh
          NEXT_TEST_DEPLOY_LOGS_SCRIPT_PATH: ${{ github.workspace }}/adapter/scripts/e2e-logs.sh
          NEXT_TEST_CLEANUP_SCRIPT_PATH: ${{ github.workspace }}/adapter/scripts/e2e-cleanup.sh
          NODE_OPTIONS: --import ${{ github.workspace }}/adapter/tools/fetch-retry.mjs
        run: node run-tests.js -c 2 -g ${{ matrix.group }} --timings --type e2e

      # Save the passed-tests file so the next attempt (if any) of this run can
      # skip them. always() so it runs on success, failure, or cancellation.
      - name: Save passed-tests cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: nextjs/.next-test-passed.txt
          key: next-test-passed-${{ strategy.job-index }}-${{ github.run_id }}-attempt${{ github.run_attempt }}

      # Upload this shard's jest-junit reports so results can be aggregated /
      # classified later. Named per shard (matrix.group contains a slash, so use
      # the job index) AND per run attempt: GitHub keeps artifacts across
      # attempts, so without the attempt suffix a re-run's artifact collides
      # with the original's name and they can't be downloaded separately. With
      # the suffix, the initial and each re-run are distinct artifacts, and the
      # ingest app tags them as separate runs (runId::runAttempt).
      # Uploaded on pass or fail.
      - name: Upload JUnit results
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: adapter-e2e-junit-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: nextjs/test/turbopack-test-junit-report/*.xml
          if-no-files-found: warn
